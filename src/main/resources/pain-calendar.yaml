openapi: 3.0.3
info:
  title: Pain Calendar API
  version: 0.1.0
  description: API for creating, updating and listing pain records.
servers:
  - url: /

paths:
  /pain-records:
    post:
      summary: Create a pain record
      operationId: createPainRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePainRecordRequest'
            examples:
              example1:
                value:
                  userId: '11111111-1111-1111-1111-111111111111'
                  date: '2025-10-01'
                  slot: MORNING
                  intensity: 6
                  location: 'Head'
                  note: 'Dolor al despertar'
                  medications: []
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Resource URL of the created record
              schema:
                type: string
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List pain records for a month
      operationId: getMonthlyPainRecords
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Monthly pain records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PainRecordSummary'
              examples:
                example1:
                  value:
                    - id: '7b572f11-a8e6-45ca-8f1b-1ec3b1370b77'
                      date: '2025-10-01'
                      intensity: 6
                      location: 'Head'
                    - id: '60431a98-48e5-46c2-9316-40781e612c9d'
                      date: '2025-10-12'
                      intensity: 4
                      location: null
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pain-records/{id}:
    get:
      summary: Get a pain record by id
      operationId: getPainRecordById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pain record detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PainRecordDetail'
        '404':
          description: Pain record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing pain record
      operationId: updatePainRecord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePainRecordRequest'
            examples:
              example1:
                value:
                  userId: '11111111-1111-1111-1111-111111111111'
                  date: '2025-10-01'
                  slot: NIGHT
                  intensity: 8
                  location: 'Neck'
                  note: 'Dolor actualizado'
                  medications: []
      responses:
        '204':
          description: Updated successfully
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pain record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Slot:
      type: string
      enum: [MORNING, AFTERNOON, EVENING, NIGHT, ALL_DAY]

    CreatePainRecordRequest:
      type: object
      required: [userId, date, slot, intensity]
      properties:
        userId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/Slot'
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: Pain intensity from 0 to 10
        location:
          type: string
          nullable: true
          maxLength: 100
        note:
          type: string
          nullable: true
          maxLength: 300
        medications:
          type: array
          items:
            $ref: '#/components/schemas/MedicationIntakeItemRequest'
          default: []

    UpdatePainRecordRequest:
      type: object
      required: [userId, date, slot, intensity]
      properties:
        userId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/Slot'
        intensity:
          type: integer
          minimum: 0
          maximum: 10
          description: Pain intensity from 0 to 10
        location:
          type: string
          nullable: true
          maxLength: 100
        note:
          type: string
          nullable: true
          maxLength: 300
        medications:
          type: array
          items:
            $ref: '#/components/schemas/MedicationIntakeItemRequest'
          default: []

    MedicationIntakeItemRequest:
      type: object
      required: [medicationId, quantity]
      properties:
        medicationId:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: 0

    PainRecordSummary:
      type: object
      required: [id, date, intensity]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        intensity:
          type: integer
          minimum: 0
          maximum: 10
        location:
          type: string
          nullable: true

    PainRecordDetail:
      type: object
      required: [id, date, slot, intensity]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/Slot'
        intensity:
          type: integer
          minimum: 0
          maximum: 10
        location:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
          nullable: true
